name: client checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playback:
    name: Browser client playback and embed contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Playback contract
        run: node scripts/test-client-playback.mjs
      - name: Embed contract (incl. chess-tactics pinned client)
        run: node scripts/test-client-embed.mjs
