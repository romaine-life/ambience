name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to validate or prebuild
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: romaine-life/pipeline-templates/actions/check-fetches@main
    - id: diff
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ "$EVENT" != pull_request ]; then
          echo code=true >> "$GITHUB_OUTPUT"
          exit 0
        fi
        files=$(git diff --name-only "$BASE...HEAD")
        if grep -qvE '\.md$|^docs/|^LICENSE$' <<< "$files"; then
          echo code=true >> "$GITHUB_OUTPUT"
        fi
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Resolve checked source
      id: checked-source
      env:
        INPUT_REF: ${{ inputs.git_ref }}
      run: |
        set -euo pipefail
        sha=$(git rev-parse HEAD)
        if [ -n "$INPUT_REF" ]; then
          sha=$(git rev-parse --verify --end-of-options "$INPUT_REF^{commit}" 2>/dev/null) ||
            sha=$(git rev-parse --verify --end-of-options "refs/remotes/origin/$INPUT_REF^{commit}" 2>/dev/null) ||
            { echo "::error::Cannot resolve requested source: $INPUT_REF"; exit 1; }
          git checkout --detach "$sha"
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "Checked source $sha"
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Chart image tags
      run: node scripts/check-chart-image-tag-sync.mjs
    - name: Browser playback
      run: node scripts/test-client-playback.mjs
    - name: Browser embedding
      run: node scripts/test-client-embed.mjs
    outputs:
      source-sha: ${{ steps.checked-source.outputs.sha }}
  image:
    needs: checks
    runs-on: ubuntu-latest
    enable-openid-connect: true
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.PIPELINE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        ref: ${{ needs.checks.outputs.source-sha }}
    - uses: romaine-life/pipeline-templates/actions/check-fetches@main
    - uses: romaine-life/pipeline-templates/actions/home-cache@main
    - name: Resolve requested ref
      env:
        INPUT_REF: ${{ needs.checks.outputs.source-sha }}
      run: |
        set -euo pipefail

        # Fetch refs so short SHAs, remote branches, and tags can all
        # resolve cleanly during manual dispatches.
        git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'

        TARGET_REF="${INPUT_REF:-$GITHUB_SHA}"
        FULL_SHA=""

        if FULL_SHA="$(git rev-parse --verify "${TARGET_REF}^{commit}" 2>/dev/null)"; then
          :
        elif git show-ref --verify --quiet "refs/remotes/origin/${TARGET_REF}"; then
          FULL_SHA="$(git rev-parse "refs/remotes/origin/${TARGET_REF}^{commit}")"
        elif git show-ref --verify --quiet "refs/tags/${TARGET_REF}"; then
          FULL_SHA="$(git rev-parse "refs/tags/${TARGET_REF}^{commit}")"
        else
          echo "::error::Unable to resolve git_ref '${TARGET_REF}' to a commit."
          exit 1
        fi

        git checkout --detach "${FULL_SHA}"
        echo "Resolved ${TARGET_REF} -> ${FULL_SHA}"
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: false
    - name: Go tests
      env:
        GOMODCACHE: ${{ runner.temp }}/ambience-gomod-${{ github.run_id }}
        GOMAXPROCS: '4'
      run: |
        go test -p 4 ./...
    - uses: romaine-life/pipeline-templates/actions/azure-cli@main
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    - name: Azure Login (OIDC)
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: azure/login@v3
      with:
        client-id: ${{ vars.ARM_CLIENT_ID }}
        tenant-id: ${{ vars.ARM_TENANT_ID }}
        subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
    - name: ACR login
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      run: |
        az acr login --name romainecr
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          network=host
          image=artifacts.home.romaine.life/dockerhub/moby/buildkit:buildx-stable-1@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
    - name: Compute image fingerprint
      id: fingerprint
      shell: bash
      run: |
        set -euo pipefail
        fingerprint="$(scripts/image-fingerprint.sh \
          --image app \
          --dockerfile Dockerfile \
          --context . \
          --paths 'Dockerfile go.mod go.sum scripts/build-web-wasm.sh rngutil sim cmd/ambience cmd/ambience-wasm' \
          | tee /tmp/ambience-image-fingerprint.txt \
          | awk -F= '$1 == "fingerprint" { print $2 }')"
        echo "IMAGE_TAG=app-${fingerprint}" >> "$GITHUB_ENV"
    - name: Check existing image
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      id: image
      shell: bash
      run: |
        set -euo pipefail
        if az acr repository show-tags \
            --name romainecr \
            --repository ambience \
            --query "[?@=='${IMAGE_TAG}'] | [0]" \
            --output tsv | grep -qx "${IMAGE_TAG}"; then
          echo "exists=true" >>"${GITHUB_OUTPUT}"
          echo "Found reusable image romainecr.azurecr.io/ambience:${IMAGE_TAG}"
        else
          echo "exists=false" >>"${GITHUB_OUTPUT}"
          echo "No reusable image found for app fingerprint ${{ steps.fingerprint.outputs.fingerprint }}"
        fi
    - name: Build and push image
      if: steps.image.outputs.exists != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: docker/build-push-action@v6
      with:
        network: host
        context: .
        file: Dockerfile
        push: true
        tags: romainecr.azurecr.io/ambience:${{ env.IMAGE_TAG }}
        cache-from: type=registry,ref=romainecr.azurecr.io/ambience-build-cache:app
        cache-to: type=registry,ref=romainecr.azurecr.io/ambience-build-cache:app,mode=max
    - name: Validate fork image without registry credentials
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
      uses: docker/build-push-action@v6
      with:
        network: host
        context: .
        file: Dockerfile
        push: false
    - name: Bump chart image tag
      env:
        TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
      if: github.event_name != 'pull_request' && !inputs.git_ref && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        # Bump the fingerprint-pinned image.tag in BOTH the prod values
        # file and the base values file, so a default-values install runs
        # the same image as prod (scripts/check-chart-image-tag-sync.mjs).
        python3 - <<'PY'
        from pathlib import Path

        tag = "${{ env.IMAGE_TAG }}"
        paths = [Path("chart/ambience/values-prod.yaml"), Path("chart/ambience/values.yaml")]
        for path in paths:
            lines = path.read_text().splitlines()
            in_image = False
            changed = False
            out = []
            for line in lines:
                stripped = line.strip()
                if stripped and not line.startswith(" ") and line.endswith(":"):
                    in_image = stripped == "image:"
                if in_image and line.startswith("  tag:"):
                    new_line = f"  tag: \"{tag}\""
                    changed = changed or line != new_line
                    out.append(new_line)
                else:
                    out.append(line)
            if changed:
                path.write_text("\n".join(out) + "\n")
        PY
        files=(chart/ambience/values-prod.yaml chart/ambience/values.yaml)
        if git diff --quiet -- "${files[@]}"; then
          echo "Chart image tag already ${IMAGE_TAG}"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "${files[@]}"
        git commit -m "chore: bump ambience image to ${IMAGE_TAG}"
        branch="FORGEJO-3-image-$GITHUB_RUN_ID"
        git switch -c "$branch"
        git push origin "$branch"
        jq -n --arg head "$branch" '{head:$head,base:"main",title:"Deploy validated ambience image",body:"https://openproject.romaine.life/wp/FORGEJO-3"}' > /tmp/image-pr.json
        pr="$(printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl --config - --fail-with-body --silent --show-error -X POST -H 'Content-Type: application/json' --data-binary @/tmp/image-pr.json "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/pulls" | jq -r .number)"
        jq -n --arg head "$(git rev-parse HEAD)" '{Do:"squash",merge_when_checks_succeed:true,delete_branch_after_merge:true,head_commit_id:$head}' > /tmp/image-merge.json
        printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl --config - --fail-with-body --silent --show-error -X POST -H 'Content-Type: application/json' --data-binary @/tmp/image-merge.json "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/pulls/$pr/merge"
    - name: Release validated source
      if: github.event_name != 'pull_request' && !inputs.git_ref && github.ref == 'refs/heads/main'
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git fetch --tags
        last=$(git tag -l 'v0.1.*' --sort=-v:refname | head -1)
        n=${last##*.}
        tag="v0.1.$((${n:-0} + 1))"
        jq -n --arg tag "$tag" --arg sha "$GITHUB_SHA" '{tag_name:$tag,target_commitish:$sha,name:$tag,body:("Validated image source at " + $sha)}' > /tmp/release.json
        printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl --config - --fail-with-body --silent --show-error -X POST -H 'Content-Type: application/json' --data-binary @/tmp/release.json "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
permissions:
  contents: write
  pull-requests: write
  id-token: write
